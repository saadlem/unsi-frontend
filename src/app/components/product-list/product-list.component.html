<section class="products-section">
  <div class="products-header" appReveal>
    <span class="section-tag">{{ 'products.tag' | t }}</span>
    <h2>{{ 'products.title' | t }}</h2>
    <p>{{ 'products.subtitle' | t }}</p>
  </div>

  <div class="products-toolbar">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="text"
        placeholder="{{ 'products.search' | t }}"
        [value]="searchTerm()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>
    <div class="categories">
      @for (cat of categories(); track cat) {
        <button
          type="button"
          class="cat-btn"
          [class.active]="selectedCategory() === cat"
          (click)="filterByCategory(cat)"
        >{{ cat === 'All' ? ('products.all' | t) : cat }}</button>
      }
    </div>
  </div>

  @if (!loaded()) {
    <div class="products-skeleton" aria-hidden="true">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="sk-card"></div>
      }
    </div>
  } @else {
    <div class="products-grid">
      @for (product of products(); track product.id) {
        <div class="product-slot">
          <app-product-card [product]="product" />
        </div>
      } @empty {
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--cream-dark)" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p>{{ 'products.empty' | t }}</p>
        </div>
      }
    </div>
  }
</section>
