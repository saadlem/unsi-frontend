<a [routerLink]="['/product', product.id]" class="card" appTilt3d [appTilt3dMax]="9">
  <div class="card-image">
    <img [src]="product.image" [alt]="product.name" loading="lazy" />
    <span class="card-category">{{ product.category }}</span>
    @if (product.stock < 10 && product.stock > 0) {
      <span class="stock-badge">Stock limité</span>
    }
    <button class="wishlist-btn" (click)="toggleWishlist($event)" [class.wishlisted]="wishlistService.isWishlisted(product.id)">
      @if (wishlistService.isWishlisted(product.id)) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#e53e3e" stroke="#e53e3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      }
    </button>
  </div>
  <div class="card-body">
    <h3>{{ product.name }}</h3>
    <p class="card-desc">{{ product.description }}</p>
    <div class="card-footer">
      <span class="card-price">{{ product.price | number:'1.2-2' }} {{ 'common.mad' | t }}</span>
      <div class="card-rating">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)" stroke="var(--gold)" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        {{ product.rating }}
      </div>
    </div>
    <button class="add-btn" (click)="addToCart($event)" [class.added]="added">
      @if (added) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        Ajouté !
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        {{ 'products.addToCart' | t }}
      }
    </button>
  </div>
</a>
