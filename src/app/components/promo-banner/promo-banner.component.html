@if (visible && banner.enabled && banner.message) {
  <div
    class="promo-banner"
    [style.background]="banner.background"
    [style.color]="banner.text_color"
  >
    <div class="promo-track" aria-hidden="true">
      <div class="promo-group">
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
      </div>
      <div class="promo-group">
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
        <span class="promo-item">{{ banner.message }}</span>
        <span class="promo-dot"></span>
      </div>
    </div>

    <a class="promo-link" [attr.href]="banner.link || null" [attr.aria-label]="banner.message"></a>
    <button class="promo-close" (click)="dismiss($event)" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
}
