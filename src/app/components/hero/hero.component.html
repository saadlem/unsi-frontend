<section class="hero">
  <div class="hero-media" aria-hidden="true">
    @for (slide of slides; track slide.src; let i = $index) {
      <img
        class="hero-image"
        [class.is-active]="active() === i"
        [src]="slide.src"
        alt=""
      />
    }
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-content">
    <p class="hero-brand">UNSI</p>
    <h1 class="hero-title">{{ 'hero.title' | t }}</h1>
    <p class="hero-subtitle">{{ 'hero.subtitle' | t }}</p>
    <p class="hero-story">{{ slides[active()].captionKey | t }}</p>
    <div class="hero-actions">
      <a routerLink="/products" class="btn-primary">{{ 'hero.cta' | t }}</a>
    </div>

    <div class="hero-dots" role="tablist" aria-label="Story">
      @for (slide of slides; track slide.src; let i = $index) {
        <button
          type="button"
          class="hero-dot"
          [class.is-active]="active() === i"
          [attr.aria-label]="'Scene ' + (i + 1)"
          [attr.aria-selected]="active() === i"
          (click)="goTo(i)"
        ></button>
      }
    </div>
  </div>
</section>
