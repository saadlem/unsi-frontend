<div class="admin-banner">
  <div class="page-header">
    <div>
      <h1>Bannière</h1>
      <p class="subtitle">Gérez la bannière affichée en haut de la boutique</p>
    </div>
  </div>

  <div class="banner-layout">
    <div class="settings-form">
      <div class="form-group">
        <div class="toggle-row">
          <div class="toggle-text">
            <label>Afficher la bannière</label>
            <p>Active ou désactive la bannière sur le site</p>
          </div>
          <button class="toggle" [class.on]="banner.enabled" (click)="banner.enabled = banner.enabled ? 0 : 1" type="button">
            <span class="knob"></span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Message de la bannière</label>
        <input [(ngModel)]="banner.message" name="message" placeholder="Ex: Livraison gratuite dès 500 MAD" class="form-input" />
      </div>

      <div class="form-group">
        <label>Lien (optionnel)</label>
        <input [(ngModel)]="banner.link" name="link" placeholder="https://..." class="form-input" />
        <small>La bannière cliquable redirige vers ce lien</small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Couleur de fond</label>
          <div class="color-field">
            <input type="color" [(ngModel)]="banner.background" name="background" class="color-input" />
            <input type="text" [(ngModel)]="banner.background" name="backgroundHex" class="form-input mono" />
          </div>
        </div>
        <div class="form-group">
          <label>Couleur du texte</label>
          <div class="color-field">
            <input type="color" [(ngModel)]="banner.text_color" name="text_color" class="color-input" />
            <input type="text" [(ngModel)]="banner.text_color" name="textColorHex" class="form-input mono" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-preview" (click)="saved = false" type="button">Rafraîchir l'aperçu</button>
        <button class="btn-save" (click)="save()" [disabled]="saving">
          {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>

      @if (saved) {
        <div class="save-success">✓ Enregistré avec succès</div>
      }
    </div>

    <div class="preview-panel">
      <h3 class="preview-title">Aperçu en direct</h3>
      <a
        class="banner-preview"
        [attr.href]="banner.link || null"
        [style.background]="banner.background"
        [style.color]="banner.text_color"
      >
        <div class="preview-content">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13"/>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
          <span>{{ banner.message || 'Votre message ici' }}</span>
        </div>
      </a>
      @if (!banner.enabled) {
        <div class="preview-disabled">Bannière désactivée</div>
      }
    </div>
  </div>
</div>
