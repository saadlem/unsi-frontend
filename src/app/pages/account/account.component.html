<div class="account-page">
  <div class="login-brand">
    <img
      class="login-logo"
      src="assets/brand/unsi-logo-mark.png"
      width="160"
      height="72"
      alt="UNSI"
    />
    <p>Objects for a warmer everyday</p>
  </div>

  <div class="auth-card">
    <h1>Administration</h1>
    <p class="subtitle">Connexion réservée à l’équipe UNSI</p>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="field">
        <label for="login-email">Nom d'utilisateur</label>
        <input id="login-email" type="text" [(ngModel)]="loginForm.email" name="email" placeholder="admin" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" [(ngModel)]="loginForm.password" name="password" placeholder="Mot de passe" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) { Connexion... } @else { Se connecter }
      </button>
    </form>
  </div>
</div>
